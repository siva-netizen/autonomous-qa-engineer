[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-qa-engineer"
version = "0.1.0"
description = "Evidence-driven multi-agent QA foundation"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "hypothesis>=6.120.0",
  "mypy==1.15.0",
  "textual>=0.86.0",
  "mcp>=1.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["agents*", "services*", "playwright*", "qa_mcp*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra -m \"not property\""
markers = [
  "property: Kiro Spec Correctness / property-based tests (run explicitly in IDE)",
]

[tool.mypy]
python_version = "3.11"
strict = true
